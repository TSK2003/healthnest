name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build -w apps/web

      - name: Prerender English homepage
        run: node scripts/prerender.mjs

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_DEPLOY_TOKEN: ${{ secrets.FIREBASE_TOKEN || secrets.FIREBASE_SERVICE_ACCOUNT_HEALTHNEST_E4D23 }}
        run: |
          npx firebase-tools deploy --only hosting --token "$FIREBASE_DEPLOY_TOKEN" --project healthnest-e4d23
